apiVersion: batch/v1
kind: Job
metadata:
  name: sync-rds-secret
  namespace: default
spec:
  ttlSecondsAfterFinished: 30
  template:
    spec:
      serviceAccountName: otel-demo-sa
      restartPolicy: Never
      containers:
        - name: sync
          image: amazon/aws-cli:latest
          command: ["sh", "-c", "sleep 10 && echo 'synced'"]
          volumeMounts:
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: rds-exporter-secrets
