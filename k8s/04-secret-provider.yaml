apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: rds-exporter-secrets
  namespace: default
spec:
  provider: aws
  parameters:
    region: us-east-1
    usePodIdentity: "true"
    objects: |
      - objectName: "otel-demo-rds-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: "DB_USERNAME"
            objectAlias: "DB_USERNAME"
          - path: "DB_PASSWORD"
            objectAlias: "DB_PASSWORD"
          - path: "DB_HOST"
            objectAlias: "DB_HOST"
          - path: "DB_PORT"
            objectAlias: "DB_PORT"
          - path: "DB_NAME"
            objectAlias: "DB_NAME"
  secretObjects:
    - secretName: rds-db-creds
      type: Opaque
      data:
        - key: DB_USERNAME
          objectName: DB_USERNAME
        - key: DB_PASSWORD
          objectName: DB_PASSWORD
        - key: DB_HOST
          objectName: DB_HOST
        - key: DB_PORT
          objectName: DB_PORT
        - key: DB_NAME
          objectName: DB_NAME
