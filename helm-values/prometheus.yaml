extraScrapeConfigs: |
  - job_name: 'otel-collector'
    scrape_interval: 10s
    static_configs:
      - targets: ['otel-collector-opentelemetry-collector:8889']
  - job_name: 'postgres-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter-prometheus-postgres-exporter:9187']

serverFiles:
  alerting_rules.yml:
    groups:
      - name: otel-demo
        rules:
          - alert: OTelCollectorDown
            expr: up{job="otel-collector"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "OTel Collector is not reachable"
              description: "Prometheus cannot scrape the collector on port 8889. Check if the pod is running."

          - alert: ServiceADown
            expr: rate(http_server_request_duration_seconds_count{exported_job="service-a"}[2m]) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service A is down"
              description: "No requests processed by Service A in the last 2 minutes."

          - alert: ServiceBDown
            expr: rate(http_server_request_duration_seconds_count{exported_job="service-b"}[2m]) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Service B is down"

          - alert: HighLatency
            expr: histogram_quantile(0.99, rate(http_server_request_duration_seconds_bucket{exported_job="service-b"}[5m])) > 0.2
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Service B p99 latency > 2s"
              description: "The 99th percentile response time for Service B is above 2 seconds."

          - alert: HighErrorRate
            expr: rate(http_server_request_duration_seconds_count{http_status_code=~"5.."}[5m]) / rate(http_server_request_duration_seconds_count[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Error rate above 5%"
              description: "More than 5% of requests are returning 5xx errors."

          - alert: High4xxRate
            expr: rate(http_server_request_duration_seconds_count{http_status_code=~"4.."}[5m]) / rate(http_server_request_duration_seconds_count[5m]) > 0.05
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "High 4xx error rate"
              description: "More than 10% of requests are returning 4xx — check broken endpoints or bad client requests."

          - alert: LowCacheHitRatio
            expr: pg_stat_database_blks_hit{datname="otel_demo"} / (pg_stat_database_blks_hit{datname="otel_demo"} + pg_stat_database_blks_read{datname="otel_demo"}) < 0.90
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL cache hit ratio below 90%"
              description: "The DB buffer cache can't hold the working set — queries are hitting disk. Consider upgrading instance class or tuning queries."

          - alert: ConnectionPoolNearLimit
            expr: pg_stat_database_numbackends{datname="otel_demo"} >= 8
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "DB connections approaching pool limit"
              description: "Active connections near the pool_size limit. Requests may be queuing for a database connection."

alertmanager:
  config:
    global:
      slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'
    route:
      group_by: ['alertname']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'slack'
    receivers:
      - name: 'slack'
        slack_configs:
          - channel: '#alerts'
            title: '{{ .GroupLabels.alertname }}'
            text: "{{ range .Alerts }}*{{ .Annotations.summary }}*\n{{ .Annotations.description }}\nSeverity: {{ .Labels.severity }}\n{{ end }}"
